<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGoldClock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF1BE" />
      <stop offset="100%" stop-color="#805B16" />
    </linearGradient>
    <radialGradient id="clockNightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241533" />
      <stop offset="100%" stop-color="#0E0814" />
    </radialGradient>
    <filter id="nightClockGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#nightClockGlow)">
    <circle cx="50" cy="50" r="44" fill="url(#clockNightBg)" stroke="url(#nightGoldClock)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#nightGoldClock)" stroke-width="0.6" stroke-dasharray="2, 3" opacity="0.6"/>

    <!-- Pocket watch top winder -->
    <ellipse cx="50" cy="18" rx="6" ry="4.5" fill="none" stroke="url(#nightGoldClock)" stroke-width="1.8"/>
    <rect x="47.5" y="20" width="5" height="4" rx="1" fill="url(#nightGoldClock)"/>

    <!-- Clock Outer Dial -->
    <circle cx="50" cy="52" r="28" fill="#140C1D" stroke="url(#nightGoldClock)" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="24" fill="none" stroke="url(#nightGoldClock)" stroke-width="0.8" stroke-dasharray="1.5, 2.5" opacity="0.6"/>

    <!-- Hour markers (12, 3, 6, 9) -->
    <rect x="49" y="31" width="2" height="5" rx="1" fill="url(#nightGoldClock)"/>
    <rect x="67" y="51" width="5" height="2" rx="1" fill="url(#nightGoldClock)"/>
    <rect x="49" y="68" width="2" height="5" rx="1" fill="url(#nightGoldClock)"/>
    <rect x="28" y="51" width="5" height="2" rx="1" fill="url(#nightGoldClock)"/>

    <!-- Time set to 21:00 hs (Hour at 9, Minute at 12) -->
    <path d="M 50 52 L 36 52" stroke="url(#nightGoldClock)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 50 52 L 50 36" stroke="url(#nightGoldClock)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="52" r="2.8" fill="#FFFDF0"/>
  </g>
</svg>
