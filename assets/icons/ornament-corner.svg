<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cornerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6517" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Borde exterior ornamental en L -->
  <path d="M4 96 L4 20 C4 11.16 11.16 4 20 4 L96 4" stroke="url(#cornerGoldGrad)" stroke-width="1.8" stroke-linecap="round" filter="url(#goldGlow)" />
  
  <!-- Filete interior decorativo -->
  <path d="M10 90 L10 24 C10 16.27 16.27 10 24 10 L90 10" stroke="url(#cornerGoldGrad)" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.85" />
  
  <!-- Florón de esquina y espirales barrocas -->
  <path d="M14 14 C18 10 26 10 30 14 C26 18 26 26 18 26 C14 22 10 18 14 14 Z" stroke="url(#cornerGoldGrad)" stroke-width="1.2" fill="none" />
  <circle cx="20" cy="20" r="2.5" fill="url(#cornerGoldGrad)" />
  
  <!-- Volutas y filigrana -->
  <path d="M4 42 C12 40 18 34 20 20 C34 18 40 12 42 4" stroke="url(#cornerGoldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M8 58 C16 54 22 46 24 36" stroke="url(#cornerGoldGrad)" stroke-width="1" stroke-linecap="round" />
  <path d="M58 8 C54 16 46 22 36 24" stroke="url(#cornerGoldGrad)" stroke-width="1" stroke-linecap="round" />
  
  <!-- Destello / Estrella en vértice -->
  <path d="M20 14 L21 19 L26 20 L21 21 L20 26 L19 21 L14 20 L19 19 Z" fill="url(#cornerGoldGrad)" opacity="0.9" />
  
  <!-- Pequeñas perlas decorativas -->
  <circle cx="4" cy="20" r="1.5" fill="url(#cornerGoldGrad)" />
  <circle cx="20" cy="4" r="1.5" fill="url(#cornerGoldGrad)" />
  <circle cx="96" cy="4" r="1.5" fill="url(#cornerGoldGrad)" />
  <circle cx="4" cy="96" r="1.5" fill="url(#cornerGoldGrad)" />
</svg>
