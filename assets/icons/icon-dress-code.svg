<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGoldDress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF1BE" />
      <stop offset="100%" stop-color="#805B16" />
    </linearGradient>
    <radialGradient id="dressNightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241533" />
      <stop offset="100%" stop-color="#0E0814" />
    </radialGradient>
    <filter id="nightDressGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#nightDressGlow)">
    <circle cx="50" cy="50" r="44" fill="url(#dressNightBg)" stroke="url(#nightGoldDress)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#nightGoldDress)" stroke-width="0.6" stroke-dasharray="2, 3" opacity="0.6"/>

    <!-- Center Bowtie / Pajarita -->
    <path d="M 50 25 L 43 20 L 43 30 Z" fill="url(#nightGoldDress)"/>
    <path d="M 50 25 L 57 20 L 57 30 Z" fill="url(#nightGoldDress)"/>
    <circle cx="50" cy="25" r="2" fill="#FFFDF0"/>

    <!-- Left: Gentleman's Tuxedo Silhouette -->
    <path d="M 32 35 L 25 52 L 31 52 L 32 72 L 44 72 L 44 35 L 38 45 L 32 35 Z" 
          fill="#140C1D" stroke="url(#nightGoldDress)" stroke-width="1.8"/>
    <path d="M 38 35 L 38 49" stroke="url(#nightGoldDress)" stroke-width="1.2"/>

    <!-- Right: Lady's Evening Gown Silhouette -->
    <path d="M 62 35 C 58 42, 60 48, 56 53 C 53 60, 50 68, 51 74 L 75 74 C 74 66, 68 57, 66 52 C 63 47, 64 41, 62 35 Z" 
          fill="#140C1D" stroke="url(#nightGoldDress)" stroke-width="1.8"/>
    <path d="M 58 51 Q 62 53 67 51" stroke="url(#nightGoldDress)" stroke-width="1.5"/>

    <circle cx="76" cy="33" r="1.5" fill="url(#nightGoldDress)"/>
  </g>
</svg>
