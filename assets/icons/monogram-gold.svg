<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Ultra-Luxury Multi-Stop Gold Foil Metallic Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="15%" stop-color="#F3D887" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="55%" stop-color="#FFF3C4" />
      <stop offset="75%" stop-color="#AA7E24" />
      <stop offset="90%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#6B4E12" />
    </linearGradient>

    <!-- Secondary Bright Gold Highlight -->
    <linearGradient id="goldHighlight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FBF0B9" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#805B16" />
    </linearGradient>

    <!-- Deep Shadow for Metallic Bevel Depth -->
    <filter id="goldLuxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFE89E" flood-opacity="0.35"/>
    </filter>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g id="masterpiece-monogram" filter="url(#goldLuxuryGlow)">
    <!-- Ambient Golden Halo -->
    <circle cx="300" cy="300" r="260" fill="url(#ringGlow)" />

    <!-- Outer Celestial Geometric Ring with Golden Foil Hairlines -->
    <circle cx="300" cy="300" r="248" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="4, 6" opacity="0.65" />
    <circle cx="300" cy="300" r="236" fill="none" stroke="url(#goldFoil)" stroke-width="3" />
    <circle cx="300" cy="300" r="226" fill="none" stroke="url(#goldFoil)" stroke-width="1" opacity="0.8" />

    <!-- 4 Cardinal Celestial Diamonds on the Ring -->
    <!-- Top -->
    <g transform="translate(300, 64) scale(0.9)">
      <polygon points="0,-10 6,0 0,10 -6,0" fill="url(#goldHighlight)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
    <!-- Bottom -->
    <g transform="translate(300, 536) scale(0.9)">
      <polygon points="0,-10 6,0 0,10 -6,0" fill="url(#goldHighlight)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
    <!-- Left -->
    <g transform="translate(64, 300) scale(0.9)">
      <polygon points="-10,0 0,6 10,0 0,-6" fill="url(#goldHighlight)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
    <!-- Right -->
    <g transform="translate(536, 300) scale(0.9)">
      <polygon points="-10,0 0,6 10,0 0,-6" fill="url(#goldHighlight)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Fine Art Laurel Flourishes (Left Side) -->
    <path d="M 175 425 C 130 380, 105 320, 110 240 C 114 175, 145 125, 205 95" 
          fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120 270 C 100 260, 90 245, 96 235 C 104 228, 115 242, 122 265 Z" fill="url(#goldHighlight)"/>
    <path d="M 112 215 C 95 205, 90 190, 100 182 C 110 180, 118 195, 116 210 Z" fill="url(#goldHighlight)"/>
    <path d="M 128 160 C 112 145, 110 130, 122 125 C 133 125, 136 140, 132 155 Z" fill="url(#goldHighlight)"/>
    <path d="M 158 115 C 145 98, 150 85, 163 84 C 174 86, 172 102, 162 113 Z" fill="url(#goldHighlight)"/>

    <!-- Fine Art Laurel Flourishes (Right Side) -->
    <path d="M 425 425 C 470 380, 495 320, 490 240 C 486 175, 455 125, 395 95" 
          fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 480 270 C 500 260, 510 245, 504 235 C 496 228, 485 242, 478 265 Z" fill="url(#goldHighlight)"/>
    <path d="M 488 215 C 505 205, 510 190, 500 182 C 490 180, 482 195, 484 210 Z" fill="url(#goldHighlight)"/>
    <path d="M 472 160 C 488 145, 490 130, 478 125 C 467 125, 464 140, 468 155 Z" fill="url(#goldHighlight)"/>
    <path d="M 442 115 C 455 98, 450 85, 437 84 C 426 86, 428 102, 438 113 Z" fill="url(#goldHighlight)"/>

    <!-- Bottom Botanical Ribbon Bow Knot -->
    <path d="M 260 480 C 285 465, 315 465, 340 480 C 315 490, 285 490, 260 480 Z" fill="url(#goldFoil)"/>
    <circle cx="300" cy="475" r="5" fill="url(#goldHighlight)"/>
    <path d="M 285 484 C 265 510, 235 522, 210 515 C 230 502, 255 494, 278 488" fill="none" stroke="url(#goldFoil)" stroke-width="2"/>
    <path d="M 315 484 C 335 510, 365 522, 390 515 C 370 502, 345 494, 322 488" fill="none" stroke="url(#goldFoil)" stroke-width="2"/>

    <!-- ===============================================================
         INTERTWINED MONOGRAM "J & M" — HIGH HAUTE LUXURY SERIF
         =============================================================== -->
    <!-- Calligraphic "J" -->
    <!-- Top Serifs and Swash -->
    <path d="M 185 165 C 205 152, 240 150, 280 155 C 260 168, 230 170, 205 178 Z" fill="url(#goldHighlight)"/>
    <!-- Main Downward Stem and Swash Loop -->
    <path d="M 235 160 C 245 155, 275 160, 282 165 C 280 180, 258 225, 252 285 C 246 370, 242 395, 230 420 C 214 450, 180 464, 150 452 C 124 440, 118 410, 136 394 C 152 380, 174 394, 170 412 C 168 422, 158 428, 150 424 C 162 436, 186 436, 202 418 C 218 398, 224 365, 228 298 C 234 238, 242 190, 252 162 Z" 
          fill="url(#goldFoil)"/>

    <!-- Romantic Ampersand "&" Layered in Background -->
    <path d="M 302 260 C 290 242, 288 224, 298 212 C 308 200, 322 202, 325 218 C 328 236, 304 260, 286 284 C 270 308, 268 332, 280 348 C 292 362, 314 360, 332 344 C 340 336, 348 324, 352 312 L 358 316 C 350 336, 338 352, 324 362 C 302 374, 276 370, 264 350 C 252 330, 254 302, 272 276 C 288 254, 312 228, 308 216 C 306 208, 300 206, 296 210 C 288 220, 288 236, 294 252 Z"
          fill="url(#goldHighlight)" opacity="0.95"/>
    <path d="M 298 308 L 355 362 L 368 356 L 318 304 Z" fill="url(#goldFoil)"/>

    <!-- Calligraphic "M" -->
    <!-- Left Leg Swash and Vertical Arch -->
    <path d="M 306 395 C 318 385, 330 350, 336 302 C 342 254, 346 200, 342 170 C 338 155, 330 152, 322 155 L 322 148 C 336 142, 354 142, 362 152 C 368 158, 366 175, 362 202 L 394 302 C 396 308, 400 308, 404 302 L 444 190 C 448 175, 448 160, 444 152 C 436 148, 428 152, 422 155 L 422 148 C 436 142, 458 142, 468 152 C 472 160, 472 175, 468 200 C 460 248, 452 320, 448 362 C 446 384, 456 392, 468 388 L 468 395 C 456 400, 434 400, 428 384 C 424 368, 428 332, 432 290 L 408 356 C 404 365, 396 365, 392 356 L 360 258 C 356 300, 350 355, 344 384 C 338 398, 325 400, 306 395 Z" 
          fill="url(#goldFoil)"/>

    <!-- Subtle Starlight Sparkles -->
    <g transform="translate(300, 115) scale(0.9)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#goldHighlight)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(170, 220) scale(0.55)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#goldHighlight)"/>
    </g>
    <g transform="translate(440, 230) scale(0.55)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#goldHighlight)"/>
    </g>
  </g>
</svg>
