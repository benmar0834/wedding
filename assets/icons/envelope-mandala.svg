<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFF9E6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8C6517" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Anillos concéntricos de filigrana -->
  <circle cx="300" cy="300" r="280" stroke="url(#mandalaGold)" stroke-width="1" stroke-dasharray="2 4" />
  <circle cx="300" cy="300" r="260" stroke="url(#mandalaGold)" stroke-width="1.5" />
  <circle cx="300" cy="300" r="245" stroke="url(#mandalaGold)" stroke-width="0.8" stroke-dasharray="6 3" />
  <circle cx="300" cy="300" r="210" stroke="url(#mandalaGold)" stroke-width="1" />
  <circle cx="300" cy="300" r="170" stroke="url(#mandalaGold)" stroke-width="1.2" stroke-dasharray="4 4" />
  <circle cx="300" cy="300" r="130" stroke="url(#mandalaGold)" stroke-width="1.5" />
  <circle cx="300" cy="300" r="80" stroke="url(#mandalaGold)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Radios ornamentales de estrella de 16 puntas -->
  <g stroke="url(#mandalaGold)" stroke-width="0.8">
    <line x1="300" y1="20" x2="300" y2="580" />
    <line x1="20" y1="300" x2="580" y2="300" />
    <line x1="102" y1="102" x2="498" y2="498" />
    <line x1="102" y1="498" x2="498" y2="102" />
    <line x1="192" y1="40" x2="408" y2="560" />
    <line x1="408" y1="40" x2="192" y2="560" />
    <line x1="40" y1="192" x2="560" y2="408" />
    <line x1="40" y1="408" x2="560" y2="192" />
  </g>

  <!-- Puntas de lanza / flores de lis en bordes -->
  <g fill="url(#mandalaGold)">
    <circle cx="300" cy="40" r="3" />
    <circle cx="300" cy="560" r="3" />
    <circle cx="40" cy="300" r="3" />
    <circle cx="560" cy="300" r="3" />
    <circle cx="116" cy="116" r="3" />
    <circle cx="484" cy="484" r="3" />
    <circle cx="116" cy="484" r="3" />
    <circle cx="484" cy="116" r="3" />
  </g>
</svg>
