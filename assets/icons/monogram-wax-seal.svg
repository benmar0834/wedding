<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Deep Imperial Plum & Onyx Wax Gradients -->
    <radialGradient id="nocturneWaxBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#4D1A2C" />
      <stop offset="30%" stop-color="#36101E" />
      <stop offset="65%" stop-color="#240813" />
      <stop offset="100%" stop-color="#0E0308" />
    </radialGradient>

    <radialGradient id="waxRimShine" cx="28%" cy="25%" r="72%">
      <stop offset="0%" stop-color="#732D45" />
      <stop offset="40%" stop-color="#3A1120" />
      <stop offset="85%" stop-color="#19050E" />
      <stop offset="100%" stop-color="#080104" />
    </radialGradient>

    <!-- Liquid Gold Foil for Debossed Stamp -->
    <linearGradient id="stampGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="20%" stop-color="#F5D884" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#FFE699" />
      <stop offset="88%" stop-color="#9A721E" />
      <stop offset="100%" stop-color="#5E410A" />
    </linearGradient>

    <filter id="waxShadowNight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="innerDeboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feOffset dx="-1" dy="-1" result="offset" />
      <feComposite operator="arithmetic" k2="1" k3="-1" in="SourceGraphic" in2="offset" result="high" />
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Organic Wax Seal Outer Body -->
  <g filter="url(#waxShadowNight)">
    <path d="M 160 22 
             C 198 20, 240 30, 269 58 
             C 298 86, 306 126, 302 166 
             C 298 206, 285 248, 253 274 
             C 221 300, 178 304, 138 297 
             C 98 290, 53 276, 32 242 
             C 11 208, 13 162, 23 124 
             C 34 85, 69 40, 112 26 
             C 128 21, 144 23, 160 22 Z" 
          fill="url(#waxRimShine)" />

    <!-- Secondary Molten Inner Pool -->
    <path d="M 160 34
             C 192 32, 230 40, 256 65 
             C 282 90, 290 126, 286 160 
             C 282 195, 269 232, 240 255 
             C 211 278, 172 282, 138 276 
             C 104 270, 66 255, 48 226 
             C 30 198, 30 158, 40 126 
             C 51 92, 81 53, 117 38 
             C 131 33, 146 35, 160 34 Z" 
          fill="url(#nocturneWaxBase)" />

    <!-- Center Debossed Seal Bed with Beaded Gold Rim -->
    <circle cx="160" cy="160" r="102" fill="#1C060E" />
    <circle cx="160" cy="160" r="102" fill="none" stroke="url(#stampGoldFoil)" stroke-width="2.5" opacity="0.9" />
    <circle cx="160" cy="160" r="95" fill="none" stroke="url(#stampGoldFoil)" stroke-width="1.2" stroke-dasharray="3, 3" opacity="0.8" />

    <!-- Embossed J & M inside Nocturne Wax Stamp -->
    <g transform="translate(160, 160) scale(0.42) translate(-300, -300)" filter="url(#innerDeboss)">
      <!-- J -->
      <path d="M 185 165 C 205 152, 240 150, 280 155 C 260 168, 230 170, 205 178 Z" fill="url(#stampGoldFoil)"/>
      <path d="M 235 160 C 245 155, 275 160, 282 165 C 280 180, 258 225, 252 285 C 246 370, 242 395, 230 420 C 214 450, 180 464, 150 452 C 124 440, 118 410, 136 394 C 152 380, 174 394, 170 412 C 168 422, 158 428, 150 424 C 162 436, 186 436, 202 418 C 218 398, 224 365, 228 298 C 234 238, 242 190, 252 162 Z" 
            fill="url(#stampGoldFoil)"/>

      <!-- Ampersand & -->
      <path d="M 302 260 C 290 242, 288 224, 298 212 C 308 200, 322 202, 325 218 C 328 236, 304 260, 286 284 C 270 308, 268 332, 280 348 C 292 362, 314 360, 332 344 C 340 336, 348 324, 352 312 L 358 316 C 350 336, 338 352, 324 362 C 302 374, 276 370, 264 350 C 252 330, 254 302, 272 276 C 288 254, 312 228, 308 216 C 306 208, 300 206, 296 210 C 288 220, 288 236, 294 252 Z"
            fill="url(#stampGoldFoil)" opacity="0.95"/>
      <path d="M 298 308 L 355 362 L 368 356 L 318 304 Z" fill="url(#stampGoldFoil)"/>

      <!-- M -->
      <path d="M 306 395 C 318 385, 330 350, 336 302 C 342 254, 346 200, 342 170 C 338 155, 330 152, 322 155 L 322 148 C 336 142, 354 142, 362 152 C 368 158, 366 175, 362 202 L 394 302 C 396 308, 400 308, 404 302 L 444 190 C 448 175, 448 160, 444 152 C 436 148, 428 152, 422 155 L 422 148 C 436 142, 458 142, 468 152 C 472 160, 472 175, 468 200 C 460 248, 452 320, 448 362 C 446 384, 456 392, 468 388 L 468 395 C 456 400, 434 400, 428 384 C 424 368, 428 332, 432 290 L 408 356 C 404 365, 396 365, 392 356 L 360 258 C 356 300, 350 355, 344 384 C 338 398, 325 400, 306 395 Z" 
            fill="url(#stampGoldFoil)"/>

      <!-- Botanical Laurel Leaf branches around seal -->
      <path d="M 185 435 C 135 390, 105 320, 110 240 C 115 160, 155 105, 215 85" 
            fill="none" stroke="url(#stampGoldFoil)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 415 435 C 465 390, 495 320, 490 240 C 485 160, 445 105, 385 85" 
            fill="none" stroke="url(#stampGoldFoil)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
