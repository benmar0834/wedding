<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGoldCal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF1BE" />
      <stop offset="100%" stop-color="#805B16" />
    </linearGradient>
    <radialGradient id="calNightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241533" />
      <stop offset="100%" stop-color="#0E0814" />
    </radialGradient>
    <filter id="nightCalGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#nightCalGlow)">
    <circle cx="50" cy="50" r="44" fill="url(#calNightBg)" stroke="url(#nightGoldCal)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#nightGoldCal)" stroke-width="0.6" stroke-dasharray="2, 3" opacity="0.6"/>

    <!-- Calendar Card Base -->
    <rect x="26" y="26" width="48" height="48" rx="8" fill="#140C1D" stroke="url(#nightGoldCal)" stroke-width="1.8"/>
    <!-- Top Header Bar -->
    <path d="M 26 34 Q 26 26 34 26 L 66 26 Q 74 26 74 34 L 74 38 L 26 38 Z" fill="url(#nightGoldCal)" />
    <!-- Binder Rings -->
    <rect x="36" y="20" width="4" height="10" rx="2" fill="url(#nightGoldCal)"/>
    <rect x="60" y="20" width="4" height="10" rx="2" fill="url(#nightGoldCal)"/>

    <!-- Date Dots -->
    <circle cx="36" cy="46" r="2" fill="url(#nightGoldCal)"/>
    <circle cx="45" cy="46" r="2" fill="url(#nightGoldCal)"/>
    <circle cx="54" cy="46" r="2" fill="url(#nightGoldCal)"/>
    <circle cx="63" cy="46" r="2" fill="url(#nightGoldCal)"/>

    <circle cx="36" cy="55" r="2" fill="url(#nightGoldCal)"/>
    <circle cx="45" cy="55" r="2" fill="url(#nightGoldCal)"/>
    <!-- Wedding Day 06 with Gold Heart -->
    <path d="M 54 52 C 54 49, 50 47, 48 49 C 46 47, 42 49, 42 52 C 42 56, 48 60, 48 60 C 48 60, 54 56, 54 52 Z" 
          transform="translate(6, 0) scale(1)" fill="#E5C158" stroke="#FFF" stroke-width="0.5"/>
    <circle cx="63" cy="55" r="2" fill="url(#nightGoldCal)"/>

    <circle cx="36" cy="64" r="2" fill="url(#nightGoldCal)"/>
    <circle cx="45" cy="64" r="2" fill="url(#nightGoldCal)"/>
    <circle cx="54" cy="64" r="2" fill="url(#nightGoldCal)"/>
    <circle cx="63" cy="64" r="2" fill="url(#nightGoldCal)"/>
  </g>
</svg>
