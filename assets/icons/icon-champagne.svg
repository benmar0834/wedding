<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGoldChamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF1BE" />
      <stop offset="100%" stop-color="#805B16" />
    </linearGradient>
    <radialGradient id="champNightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241533" />
      <stop offset="100%" stop-color="#0E0814" />
    </radialGradient>
    <filter id="nightChampGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#nightChampGlow)">
    <circle cx="50" cy="50" r="44" fill="url(#champNightBg)" stroke="url(#nightGoldChamp)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#nightGoldChamp)" stroke-width="0.6" stroke-dasharray="2, 3" opacity="0.6"/>

    <!-- Left Flute -->
    <g transform="translate(39, 52) rotate(14) translate(-39, -52)">
      <path d="M 33 26 L 45 26 C 45 42, 41 50, 39 55 L 39 74 L 30 74 L 30 77 L 48 77 L 48 74 L 39 74 L 39 55 C 37 50, 33 42, 33 26 Z" 
            fill="#140C1D" stroke="url(#nightGoldChamp)" stroke-width="2"/>
      <path d="M 35 34 C 37 34, 41 34, 43 34 C 43 44, 40 50, 39 53 C 38 50, 35 44, 35 34 Z" fill="url(#nightGoldChamp)" opacity="0.45"/>
    </g>

    <!-- Right Flute -->
    <g transform="translate(61, 52) rotate(-14) translate(-61, -52)">
      <path d="M 55 26 L 67 26 C 67 42, 63 50, 61 55 L 61 74 L 52 74 L 52 77 L 70 77 L 70 74 L 61 74 L 61 55 C 59 50, 55 42, 55 26 Z" 
            fill="#140C1D" stroke="url(#nightGoldChamp)" stroke-width="2"/>
      <path d="M 57 34 C 59 34, 63 34, 65 34 C 65 44, 62 50, 61 53 C 60 50, 57 44, 57 34 Z" fill="url(#nightGoldChamp)" opacity="0.45"/>
    </g>

    <!-- Sparkle Toast -->
    <path d="M 50 20 Q 50 25 55 25 Q 50 25 50 30 Q 50 25 45 25 Q 50 25 50 20 Z" fill="#FFF8E7"/>
    <circle cx="50" cy="14" r="1.5" fill="url(#nightGoldChamp)"/>
    <circle cx="46" cy="10" r="1" fill="url(#nightGoldChamp)"/>
    <circle cx="54" cy="9" r="1.2" fill="url(#nightGoldChamp)"/>
  </g>
</svg>
