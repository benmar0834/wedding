<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGoldEnv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF1BE" />
      <stop offset="100%" stop-color="#805B16" />
    </linearGradient>
    <radialGradient id="envNightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241533" />
      <stop offset="100%" stop-color="#0E0814" />
    </radialGradient>
    <filter id="nightEnvGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#nightEnvGlow)">
    <circle cx="50" cy="50" r="44" fill="url(#envNightBg)" stroke="url(#nightGoldEnv)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#nightGoldEnv)" stroke-width="0.6" stroke-dasharray="2, 3" opacity="0.6"/>

    <!-- Black & Gold Envelope Body -->
    <rect x="24" y="34" width="52" height="36" rx="5" fill="#140C1D" stroke="url(#nightGoldEnv)" stroke-width="1.8"/>
    <!-- Fold Lines -->
    <path d="M 24 35 L 50 53 L 76 35" fill="none" stroke="url(#nightGoldEnv)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 24 68 L 41 51" fill="none" stroke="url(#nightGoldEnv)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 76 68 L 59 51" fill="none" stroke="url(#nightGoldEnv)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Mini Plum Wax Seal -->
    <circle cx="50" cy="53" r="6.5" fill="#3D1223" stroke="url(#nightGoldEnv)" stroke-width="1"/>
    <circle cx="50" cy="53" r="4" fill="none" stroke="url(#nightGoldEnv)" stroke-width="0.6"/>
  </g>
</svg>
