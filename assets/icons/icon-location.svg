<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGoldPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF1BE" />
      <stop offset="100%" stop-color="#805B16" />
    </linearGradient>
    <radialGradient id="locNightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241533" />
      <stop offset="100%" stop-color="#0E0814" />
    </radialGradient>
    <filter id="nightLocGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#nightLocGlow)">
    <circle cx="50" cy="50" r="44" fill="url(#locNightBg)" stroke="url(#nightGoldPin)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#nightGoldPin)" stroke-width="0.6" stroke-dasharray="2, 3" opacity="0.6"/>

    <!-- Map Pin Teardrop Shape -->
    <path d="M 50 22 C 37 22, 28 32, 28 44 C 28 58, 45 72, 50 76 C 55 72, 72 58, 72 44 C 72 32, 63 22, 50 22 Z" 
          fill="#140C1D" stroke="url(#nightGoldPin)" stroke-width="2.5" />

    <!-- Center Jewel Pin with Golden Diamond/Heart -->
    <circle cx="50" cy="42" r="12" fill="url(#nightGoldPin)" />
    <!-- Heart Cutout -->
    <path d="M 50 48 C 50 48, 43 43, 43 39 C 43 36, 46 34, 48 36 C 49 37, 50 38, 50 38 C 50 38, 51 37, 52 36 C 54 34, 57 36, 57 39 C 57 43, 50 48, 50 48 Z" fill="#140C1D"/>
  </g>
</svg>
